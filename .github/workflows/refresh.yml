name: Refresh 13F data

on:
  schedule:
    # Runs daily at 13:00 UTC. Cheap to run daily since the script only
    # writes when a fund has actually filed something new (upsert on
    # cik + period_end). Tighten this to run more often only in the
    # week around each 45-day deadline if you want fresher same-day data.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest 13F filings and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_13f.py
