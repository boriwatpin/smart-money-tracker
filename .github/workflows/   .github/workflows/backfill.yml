name: Backfill 13F history (manual, one-time)

on:
  workflow_dispatch: {}
  # Intentionally no schedule -- this is a one-time (or occasional) job.
  # The daily "Refresh 13F data" workflow handles ongoing updates.

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Backfill 3 years of 13F history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          cd scripts
          python backfill_13f.py
