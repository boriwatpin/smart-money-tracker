name: Refresh winners & losers

on:
  schedule:
    # Weekdays at 22:30 UTC, after the US market close (20:00 or 21:00 UTC
    # depending on daylight saving), so "current price" is that day's close.
    # Far enough from the 13:00 UTC 13F refresh that the two never overlap.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild: re-download all price history and rebuild the daily fund history (use after adding a fund)"
        type: boolean
        required: false
        default: false

concurrency:
  group: winners-losers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The first run downloads ~3 years of prices for every ticker the funds
    # have held and can take 30-60 minutes; nightly runs take a few minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # yfinance is upgraded on every run: it's unofficial and breaks
        # whenever Yahoo changes something, and fixes ship as new releases.
        run: |
          pip install -r scripts/requirements.txt
          pip install --upgrade yfinance

      - name: Compute winners & losers and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REBUILD_HISTORY: ${{ inputs.rebuild }}
        run: |
          cd scripts
          python winners_losers.py

      - name: Run the copycat backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          cd scripts
          python backtest.py
