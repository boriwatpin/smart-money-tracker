name: Backfill 13F history (manual, one-time)

on:
  workflow_dispatch:
    inputs:
      ciks:
        description: "Only these CIKs, comma-separated (leave blank for all funds)"
        required: false
        default: ""
      archive_only:
        description: "Archive only: fill the holdings archive, leave the dashboard data alone"
        type: boolean
        required: false
        default: false
  # Intentionally no schedule -- this is a one-time (or occasional) job.
  # The daily "Refresh 13F data" workflow handles ongoing updates.

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Backfill 3 years of 13F history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BACKFILL_CIKS: ${{ inputs.ciks }}
          ARCHIVE_ONLY: ${{ inputs.archive_only }}
        run: |
          cd scripts
          python backfill_13f.py
